interface:
  display_name: "MCM-CUP-STANDARD-WRITE"
  short_description: "按国赛全文语言模式写出自然、有判断过程且不机械的中文建模论文"
  default_prompt: "使用 $mcm-cup-standard-write；先读全文语言调用协议、建模推演工作台、分问推演预审和公开判断动作库，并按当前题型、章节、动作和模型检索 3--8 个真实正文段落及相邻上下文。正文前冻结题面、数据、代码和结果源的 SHA-256，完成事实锚点、数学落点和实际路线的建模推演；25--30 页长稿中，每问须先由队员批准一页以内的来源、锚点、数学落点和路线，未获批准不得扩写，任何来源或路线变化都须重审。随后必须把思考过程写进正文：在每个非直接列式的首次模型前，先写本题对象、现象、前问接口或试算如何变成变量、方程、约束、数据口径或局部矛盾，再自然进入模型。直接列式、承接前问、试算回退和结果解释使用不同节奏，不套统一选型段，也不照抄范文。反向检查和边界仅在实际需要时出现。正式长稿还要扫描未裁决的语料长重合，并在冻结候选后完成两名队员的分问思考桥偏离复述；若需降 AI 改写，只做一次受保护处理并核对公式、数字、单位、引用和结果。"
